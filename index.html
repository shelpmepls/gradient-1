<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/css-doodle/0.38.5/css-doodle.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Her exact gradient code from the screenshot */
        .gradient {
            width: 100%;
            height: 100%;
            background: #B7B9B8;
            background: linear-gradient(
                160deg, 
                #C8BBB2 45%, 
                #DCBA9F 81%, 
                #EC9965 89%
            );
            position: relative;
        }

        /* CSS Doodle texture overlay - recreating her box-shadow effect */
        css-doodle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            mix-blend-mode: soft-light;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gradient">
            <!-- CSS Doodle component - creates the textured shadow effect -->
            <css-doodle>
                :doodle {
                    @grid: 10 / 100vw 100vh;
                }
                box-shadow:
                    @m10(
                        @r(100vw) @r(100vh) 
                        @r(30vmin, 50vmin) 
                        @r(40vmin)
                        @pd(#E3764C, #E05B38)
                    );
            </css-doodle>
        </div>
    </div>
</body>
</html>
